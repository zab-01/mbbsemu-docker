services:
  mbbsemu:
    image: ghcr.io/zab-01/mbbsemu:latest
    container_name: mbbsemu
    ports:
      - "2323:23"
      - "1513:513"
    environment:
      TZ: America/Chicago
      PUID: "99"     # Unraid typical
      PGID: "100"    # Unraid typical
      SYSOP_PASSWORD: "testpass"
      # Optional overrides (defaults already baked in):
      # MUD_REG_NUMBER: "12345678"
      # MUD_ACTIVATION_CODE: "dlhbdfhjlnp"
      # MUD_PLUS_ACTIVATION_CODE: "XVDXBUATGZ"
      # AUTO_FETCH_WCCMMUD: "true"
      # AUTO_ENABLE_WCCMMUD: "true"
    volumes:
      - ./config:/config
    restart: unless-stopped
